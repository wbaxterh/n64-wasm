name: Build WASM core

# Builds the Emscripten WASM core and publishes dist/ as an artifact.
# The Makefile uses -mrelaxed-simd / -pthread / FULL_ES3, which require a
# modern emsdk (~3.1.50+) — the README's 2.0.7 badge is stale relative to it.

on:
  push:
    branches: [main, 'm1-*', 'feat/*']
    paths: ['code/**', '.github/workflows/build-wasm.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - name: Verify emcc
        run: emcc --version

      # Warm the ports cache with the SAME flags the real build uses (incl.
      # -flto), via a single serial emcc. This builds the LTO variants of
      # sdl2_ttf/harfbuzz/etc up front so the parallel make below can't race
      # on the port-cache lock.
      - name: Warm Emscripten ports cache (LTO variants)
        run: |
          echo 'int main(void){return 0;}' > warm.c
          emcc -O3 -flto -msimd128 -mrelaxed-simd -pthread \
            -s USE_SDL=2 -s USE_SDL_TTF=2 -s USE_SDL_IMAGE=2 -s USE_ZLIB=1 \
            -c warm.c -o warm.o
          rm -f warm.c warm.o

      - name: Build core
        working-directory: code
        run: |
          mkdir -p ../dist
          emmake make -j"$(nproc)"

      - name: Confirm RDRAM accessor is exported
        run: |
          if grep -q "_neilGetRdramBase" dist/n64wasm.js; then
            echo "OK: _neilGetRdramBase present in glue"
          else
            echo "WARNING: _neilGetRdramBase not found in dist/n64wasm.js"
          fi
          ls -la dist/

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: n64wasm-dist
          path: |
            dist/n64wasm.js
            dist/n64wasm.wasm
            dist/n64wasm.worker.js
          if-no-files-found: error
