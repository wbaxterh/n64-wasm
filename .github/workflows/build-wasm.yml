name: Build WASM core

# Builds the Emscripten WASM core and publishes dist/ as an artifact.
# The Makefile uses -mrelaxed-simd / -pthread / FULL_ES3, which require a
# modern emsdk (~3.1.50+) — the README's 2.0.7 badge is stale relative to it.

on:
  push:
    branches: [main, 'm1-*', 'feat/*']
    paths: ['code/**', '.github/workflows/build-wasm.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - name: Verify emcc
        run: emcc --version

      # Build ports LEAF-FIRST so sdl2_ttf finds harfbuzz/freetype already
      # cached (emscripten's sdl2_ttf recipe otherwise nest-builds harfbuzz
      # while holding the cache lock → AssertionError). --lto matches the
      # real build's -flto variant. Order is load-bearing: harfbuzz before
      # sdl2_ttf.
      - name: Warm Emscripten ports cache (leaf-first, LTO)
        run: |
          embuilder build zlib --lto
          embuilder build freetype --lto
          embuilder build harfbuzz --lto
          embuilder build sdl2 --lto
          embuilder build sdl2_ttf --lto
          embuilder build sdl2_image --lto

      - name: Build core
        working-directory: code
        run: |
          mkdir -p ../dist
          emmake make -j"$(nproc)"

      - name: Confirm RDRAM accessor is exported
        run: |
          if grep -q "_neilGetRdramBase" dist/n64wasm.js; then
            echo "OK: _neilGetRdramBase present in glue"
          else
            echo "WARNING: _neilGetRdramBase not found in dist/n64wasm.js"
          fi
          ls -la dist/

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: n64wasm-dist
          path: |
            dist/n64wasm.js
            dist/n64wasm.wasm
            dist/n64wasm.worker.js
          if-no-files-found: error
